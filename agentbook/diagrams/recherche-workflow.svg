<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="620" viewBox="0 0 1400 620" role="img" aria-labelledby="title desc">
  <title id="title">Der fünfstufige Recherche-Workflow</title>
  <desc id="desc">Auftrag, Recherche durch den Agenten, strukturierte Ausgabe, menschliche Prüfung als Kontrollpunkt, Weiterverarbeitung.</desc>
  <rect width="1400" height="620" fill="#f7f7f3"/>
  <text x="80" y="84" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700" fill="#202124">Belastbare Recherche in fünf Phasen</text>
  <text x="80" y="126" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#4b5563">Der Agent erledigt die Vorarbeit. Der Mensch entscheidet, was belastbar ist.</text>

  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="70" y="200" width="230" height="150" rx="16" fill="#eef2ff" stroke="#3730a3" stroke-width="3"/>
    <text x="92" y="248" font-size="22" font-weight="700" fill="#312e81">1 · Auftrag</text>
    <text x="92" y="284" font-size="18" fill="#3730a3">Frage, Zweck,</text>
    <text x="92" y="310" font-size="18" fill="#3730a3">Umfang, Quellen,</text>
    <text x="92" y="336" font-size="18" fill="#3730a3">Format</text>

    <rect x="345" y="200" width="230" height="150" rx="16" fill="#ecfdf5" stroke="#047857" stroke-width="3"/>
    <text x="367" y="248" font-size="22" font-weight="700" fill="#064e3b">2 · Recherche</text>
    <text x="367" y="284" font-size="18" fill="#065f46">Quellen sichten,</text>
    <text x="367" y="310" font-size="18" fill="#065f46">Fakten und Muster</text>
    <text x="367" y="336" font-size="18" fill="#065f46">extrahieren</text>

    <rect x="620" y="200" width="230" height="150" rx="16" fill="#eff6ff" stroke="#1d4ed8" stroke-width="3"/>
    <text x="642" y="248" font-size="22" font-weight="700" fill="#1e3a8a">3 · Ausgabe</text>
    <text x="642" y="284" font-size="18" fill="#1e40af">Kurzfazit, Fakten</text>
    <text x="642" y="310" font-size="18" fill="#1e40af">mit Quellen,</text>
    <text x="642" y="336" font-size="18" fill="#1e40af">Unsicherheiten</text>

    <rect x="895" y="185" width="230" height="180" rx="16" fill="#fef3c7" stroke="#b45309" stroke-width="5"/>
    <text x="917" y="236" font-size="22" font-weight="700" fill="#7c2d12">4 · Prüfung</text>
    <text x="917" y="272" font-size="18" fill="#92400e">Quellen bewerten,</text>
    <text x="917" y="298" font-size="18" fill="#92400e">3 wichtigste Fakten</text>
    <text x="917" y="324" font-size="18" fill="#92400e">an der Quelle prüfen</text>
    <text x="917" y="352" font-size="16" font-weight="700" fill="#7c2d12">Kontrollpunkt</text>

    <rect x="1170" y="200" width="160" height="150" rx="16" fill="#ffffff" stroke="#1f2937" stroke-width="3"/>
    <text x="1192" y="248" font-size="22" font-weight="700" fill="#111827">5 · Nutzen</text>
    <text x="1192" y="284" font-size="18" fill="#374151">Artikel,</text>
    <text x="1192" y="310" font-size="18" fill="#374151">Angebot,</text>
    <text x="1192" y="336" font-size="18" fill="#374151">Entscheidung</text>

    <g stroke="#6b7280" stroke-width="5" fill="none">
      <path d="M300 275 L345 275"/>
      <path d="M575 275 L620 275"/>
      <path d="M850 275 L895 275"/>
      <path d="M1125 275 L1170 275"/>
    </g>

    <text x="80" y="440" font-size="20" fill="#6b7280">Ohne Phase 4 entsteht das Gefühl von Gründlichkeit ohne die Grundlage dafür.</text>
  </g>
</svg>
