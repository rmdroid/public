<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="600" viewBox="0 0 1400 600" role="img" aria-labelledby="title desc">
  <title id="title">Wochensystem für Kundenkommunikation</title>
  <desc id="desc">Montags Triage, mittwochs Follow-up-Prüfung, freitags Nachbereitung – jeweils mit Agent, Freigabe durch den Menschen.</desc>
  <rect width="1400" height="600" fill="#f7f7f3"/>
  <text x="80" y="84" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700" fill="#202124">Ein Wochensystem für Kundenkommunikation</text>
  <text x="80" y="126" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#4b5563">Drei feste Runden statt ständiger Unterbrechungen. Der Agent bereitet vor, Sie geben frei.</text>

  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="80" y="200" width="380" height="230" rx="18" fill="#eff6ff" stroke="#1d4ed8" stroke-width="3"/>
    <text x="112" y="256" font-size="26" font-weight="700" fill="#1e3a8a">Montag · Triage</text>
    <text x="112" y="300" font-size="20" fill="#1e40af">Alle E-Mails einordnen,</text>
    <text x="112" y="330" font-size="20" fill="#1e40af">priorisieren, Antwort-</text>
    <text x="112" y="360" font-size="20" fill="#1e40af">entwürfe vorbereiten.</text>
    <text x="112" y="404" font-size="18" fill="#6b7280">20–30 Minuten</text>

    <rect x="510" y="200" width="380" height="230" rx="18" fill="#ecfdf5" stroke="#047857" stroke-width="3"/>
    <text x="542" y="256" font-size="26" font-weight="700" fill="#064e3b">Mittwoch · Follow-up</text>
    <text x="542" y="300" font-size="20" fill="#065f46">Offene Anfragen und</text>
    <text x="542" y="330" font-size="20" fill="#065f46">ausstehende Angebote</text>
    <text x="542" y="360" font-size="20" fill="#065f46">erkennen, Entwürfe.</text>
    <text x="542" y="404" font-size="18" fill="#6b7280">20–30 Minuten</text>

    <rect x="940" y="200" width="380" height="230" rx="18" fill="#fff7ed" stroke="#c2410c" stroke-width="3"/>
    <text x="972" y="256" font-size="26" font-weight="700" fill="#7c2d12">Freitag · Nachbereitung</text>
    <text x="972" y="300" font-size="20" fill="#9a3412">Mitschriften aufbereiten,</text>
    <text x="972" y="330" font-size="20" fill="#9a3412">Aufgaben übertragen,</text>
    <text x="972" y="360" font-size="20" fill="#9a3412">Follow-up-Entwürfe.</text>
    <text x="972" y="404" font-size="18" fill="#6b7280">20–30 Minuten</text>

    <g stroke="#6b7280" stroke-width="5" fill="none">
      <path d="M460 315 L510 315"/>
      <path d="M890 315 L940 315"/>
    </g>

    <rect x="80" y="478" width="1240" height="72" rx="14" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
    <text x="112" y="522" font-size="22" font-weight="700" fill="#111827">Unveränderliche Regel: Keine Nachricht verlässt das Haus ohne Ihre Freigabe.</text>
  </g>
</svg>
