<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720" role="img" aria-labelledby="title desc">
  <title id="title">Die fünf Muster der Agenten-Zusammenarbeit</title>
  <desc id="desc">Orchestrator-Worker, Parallelisierung, sequenzielles Verketten, Evaluator-Optimierer und Routing im Überblick.</desc>
  <rect width="1400" height="720" fill="#f7f7f3"/>
  <text x="80" y="84" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700" fill="#202124">Fünf Muster für mehrere Agenten</text>
  <text x="80" y="126" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#4b5563">Einfach anfangen. Mehr Muster nur, wenn sie nachweisbar bessere Ergebnisse bringen.</text>

  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="70" y="190" width="400" height="190" rx="16" fill="#eef2ff" stroke="#3730a3" stroke-width="3"/>
    <text x="98" y="240" font-size="24" font-weight="700" fill="#312e81">1 · Orchestrator-Worker</text>
    <text x="98" y="282" font-size="19" fill="#3730a3">Ein Planer zerlegt, delegiert</text>
    <text x="98" y="310" font-size="19" fill="#3730a3">an Worker, führt zusammen.</text>
    <text x="98" y="350" font-size="18" fill="#6b7280">Für große, teilbare Projekte.</text>

    <rect x="500" y="190" width="400" height="190" rx="16" fill="#ecfdf5" stroke="#047857" stroke-width="3"/>
    <text x="528" y="240" font-size="24" font-weight="700" fill="#064e3b">2 · Parallelisierung</text>
    <text x="528" y="282" font-size="19" fill="#065f46">Unabhängige Teilaufgaben</text>
    <text x="528" y="310" font-size="19" fill="#065f46">gleichzeitig bearbeiten.</text>
    <text x="528" y="350" font-size="18" fill="#6b7280">Spart Zeit bei Recherche.</text>

    <rect x="930" y="190" width="400" height="190" rx="16" fill="#eff6ff" stroke="#1d4ed8" stroke-width="3"/>
    <text x="958" y="240" font-size="24" font-weight="700" fill="#1e3a8a">3 · Sequenz</text>
    <text x="958" y="282" font-size="19" fill="#1e40af">Schritt für Schritt, jeder</text>
    <text x="958" y="310" font-size="19" fill="#1e40af">prüfbar vor dem nächsten.</text>
    <text x="958" y="350" font-size="18" fill="#6b7280">Der beste Einstieg.</text>

    <rect x="285" y="420" width="400" height="190" rx="16" fill="#fef3c7" stroke="#b45309" stroke-width="3"/>
    <text x="313" y="470" font-size="24" font-weight="700" fill="#7c2d12">4 · Evaluator-Optimierer</text>
    <text x="313" y="512" font-size="19" fill="#92400e">Einer erzeugt, einer prüft</text>
    <text x="313" y="540" font-size="19" fill="#92400e">kritisch, Schleife bis gut.</text>
    <text x="313" y="580" font-size="18" fill="#6b7280">Für Texte mit Außenwirkung.</text>

    <rect x="715" y="420" width="400" height="190" rx="16" fill="#fdf2f8" stroke="#9d174d" stroke-width="3"/>
    <text x="743" y="470" font-size="24" font-weight="700" fill="#831843">5 · Routing</text>
    <text x="743" y="512" font-size="19" fill="#9d174d">Triage leitet jede Anfrage</text>
    <text x="743" y="540" font-size="19" fill="#9d174d">an den passenden Agenten.</text>
    <text x="743" y="580" font-size="18" fill="#6b7280">Für gemischte Eingänge.</text>

    <text x="80" y="668" font-size="20" fill="#6b7280">Faustregel: parallel oder unabhängig prüfen → mehrere Agenten. Eng gekoppelt → ein Agent.</text>
  </g>
</svg>
