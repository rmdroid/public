<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="560" viewBox="0 0 1400 560" role="img" aria-labelledby="title desc">
  <title id="title">Der 30-Tage-Plan im Überblick</title>
  <desc id="desc">Vorbereitungswoche, dann vier Wochen: eine Routine, zwei weitere Routinen, härten, messen – danach vierteljährliche Schleife.</desc>
  <rect width="1400" height="560" fill="#f7f7f3"/>
  <text x="80" y="80" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700" fill="#202124">Der 30-Tage-Plan</text>
  <text x="80" y="122" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#4b5563">Ein Workflow, dann messen, dann erweitern. Jede Woche ein nutzbares Ergebnis.</text>

  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="40" y="200" width="250" height="200" rx="16" fill="#f1f5f9" stroke="#64748b" stroke-width="3"/>
    <text x="64" y="248" font-size="22" font-weight="700" fill="#334155">Vorwoche</text>
    <text x="64" y="288" font-size="18" fill="#475569">Baseline-Audit,</text>
    <text x="64" y="314" font-size="18" fill="#475569">Werkzeug wählen,</text>
    <text x="64" y="340" font-size="18" fill="#475569">erste CLAUDE.md</text>

    <rect x="310" y="200" width="250" height="200" rx="16" fill="#eef2ff" stroke="#3730a3" stroke-width="3"/>
    <text x="334" y="248" font-size="22" font-weight="700" fill="#312e81">Woche 1</text>
    <text x="334" y="288" font-size="18" fill="#3730a3">Eine Routine,</text>
    <text x="334" y="314" font-size="18" fill="#3730a3">jeden Tag,</text>
    <text x="334" y="340" font-size="18" fill="#3730a3">Ergebnisse prüfen</text>

    <rect x="580" y="200" width="250" height="200" rx="16" fill="#ecfdf5" stroke="#047857" stroke-width="3"/>
    <text x="604" y="248" font-size="22" font-weight="700" fill="#064e3b">Woche 2</text>
    <text x="604" y="288" font-size="18" fill="#065f46">Zwei weitere</text>
    <text x="604" y="314" font-size="18" fill="#065f46">Routinen,</text>
    <text x="604" y="340" font-size="18" fill="#065f46">erste Zahlen</text>

    <rect x="850" y="200" width="250" height="200" rx="16" fill="#fef3c7" stroke="#b45309" stroke-width="3"/>
    <text x="874" y="248" font-size="22" font-weight="700" fill="#7c2d12">Woche 3</text>
    <text x="874" y="288" font-size="18" fill="#92400e">Sicherheit &amp;</text>
    <text x="874" y="314" font-size="18" fill="#92400e">Qualität härten,</text>
    <text x="874" y="340" font-size="18" fill="#92400e">Hooks, Stichprobe</text>

    <rect x="1120" y="200" width="250" height="200" rx="16" fill="#eff6ff" stroke="#1d4ed8" stroke-width="3"/>
    <text x="1144" y="248" font-size="22" font-weight="700" fill="#1e3a8a">Woche 4</text>
    <text x="1144" y="288" font-size="18" fill="#1e40af">Wirkung messen,</text>
    <text x="1144" y="314" font-size="18" fill="#1e40af">auswerten,</text>
    <text x="1144" y="340" font-size="18" fill="#1e40af">nächsten Monat planen</text>

    <g stroke="#6b7280" stroke-width="5" fill="none">
      <path d="M290 300 L310 300"/>
      <path d="M560 300 L580 300"/>
      <path d="M830 300 L850 300"/>
      <path d="M1100 300 L1120 300"/>
    </g>

    <path d="M1245 400 C1245 470, 705 490, 165 470 C 120 466, 120 430, 120 405" stroke="#9ca3af" stroke-width="4" stroke-dasharray="9 9" fill="none"/>
    <text x="640" y="500" font-size="20" fill="#6b7280">danach: vierteljährliche Schleife – neu messen, erneuern, erweitern</text>
  </g>
</svg>
