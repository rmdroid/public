<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="600" viewBox="0 0 1400 600" role="img" aria-labelledby="title desc">
  <title id="title">Sicher automatisieren in vier Stufen</title>
  <desc id="desc">Sicherungskopie, kleine Testmenge, sorgfältig prüfen, erst dann produktiv einsetzen.</desc>
  <rect width="1400" height="600" fill="#f7f7f3"/>
  <text x="80" y="84" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700" fill="#202124">Sicher automatisieren in vier Stufen</text>
  <text x="80" y="126" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#4b5563">Erst absichern und testen, dann produktiv. Nie umgekehrt.</text>

  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="70" y="210" width="280" height="170" rx="16" fill="#eef2ff" stroke="#3730a3" stroke-width="3"/>
    <text x="98" y="262" font-size="24" font-weight="700" fill="#312e81">1 · Absichern</text>
    <text x="98" y="300" font-size="19" fill="#3730a3">Sicherungskopie,</text>
    <text x="98" y="326" font-size="19" fill="#3730a3">Test- statt</text>
    <text x="98" y="352" font-size="19" fill="#3730a3">Produktivumgebung</text>

    <rect x="395" y="210" width="280" height="170" rx="16" fill="#ecfdf5" stroke="#047857" stroke-width="3"/>
    <text x="423" y="262" font-size="24" font-weight="700" fill="#064e3b">2 · Klein testen</text>
    <text x="423" y="300" font-size="19" fill="#065f46">5 Testdateien</text>
    <text x="423" y="326" font-size="19" fill="#065f46">statt 500 echte,</text>
    <text x="423" y="352" font-size="19" fill="#065f46">synthetische Daten</text>

    <rect x="720" y="210" width="280" height="170" rx="16" fill="#fef3c7" stroke="#b45309" stroke-width="5"/>
    <text x="748" y="262" font-size="24" font-weight="700" fill="#7c2d12">3 · Prüfen</text>
    <text x="748" y="300" font-size="19" fill="#92400e">Ergebnis kontrollieren,</text>
    <text x="748" y="326" font-size="19" fill="#92400e">bei Code mit Daten:</text>
    <text x="748" y="352" font-size="19" fill="#92400e">auf Sicherheit prüfen</text>

    <rect x="1045" y="210" width="280" height="170" rx="16" fill="#ffffff" stroke="#1f2937" stroke-width="3"/>
    <text x="1073" y="262" font-size="24" font-weight="700" fill="#111827">4 · Produktiv</text>
    <text x="1073" y="300" font-size="19" fill="#374151">Erst nach</text>
    <text x="1073" y="326" font-size="19" fill="#374151">bestandener Prüfung</text>
    <text x="1073" y="352" font-size="19" fill="#374151">live schalten</text>

    <g stroke="#6b7280" stroke-width="5" fill="none">
      <path d="M350 295 L395 295"/>
      <path d="M675 295 L720 295"/>
      <path d="M1000 295 L1045 295"/>
    </g>

    <text x="80" y="460" font-size="20" fill="#6b7280">2026: Rund die Hälfte des KI-generierten Codes enthält mindestens eine Sicherheitsschwäche.</text>
  </g>
</svg>
