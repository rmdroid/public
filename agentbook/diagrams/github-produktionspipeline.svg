<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="760" viewBox="0 0 1300 760" role="img" aria-labelledby="title desc">
  <title id="title">GitHub Produktionspipeline für das interaktive Buch</title>
  <desc id="desc">Privates Manuskriptrepo baut EPUB, DOCX und Website; öffentliche Ausspielung erfolgt über ein separates Public-Repo.</desc>
  <defs>
    <style>
      .bg{fill:#f8fafc}.box{fill:#fff;stroke:#243447;stroke-width:2.5}.private{fill:#f1efff;stroke:#5b42b1;stroke-width:2.5}.public{fill:#e9f8ef;stroke:#2c7a43;stroke-width:2.5}.artifact{fill:#fff6e8;stroke:#9a6500;stroke-width:2.5}.txt{font-family:Arial,Helvetica,sans-serif;fill:#16202a}.h{font-size:31px;font-weight:700}.p{font-size:22px}.s{font-size:18px}.arrow{stroke:#243447;stroke-width:3.5;fill:none;marker-end:url(#arrow)}
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,4 L0,8 Z" fill="#243447"/>
    </marker>
  </defs>
  <rect class="bg" width="1300" height="760"/>
  <text class="txt h" x="70" y="70">Produktionspipeline: privates Repo, öffentliche Ausspielung</text>
  <rect class="private" x="70" y="140" width="310" height="150" rx="12"/>
  <text class="txt h" x="100" y="190">Privates Repo</text>
  <text class="txt p" x="100" y="230">Manuskript, Quellen,</text>
  <text class="txt p" x="100" y="260">Arbeitsnotizen, Actions</text>
  <rect class="box" x="500" y="140" width="310" height="150" rx="12"/>
  <text class="txt h" x="530" y="190">GitHub Actions</text>
  <text class="txt p" x="530" y="230">Pandoc, VitePress,</text>
  <text class="txt p" x="530" y="260">Validierung</text>
  <rect class="artifact" x="920" y="105" width="310" height="110" rx="12"/>
  <text class="txt h" x="950" y="152">Buch-Artefakte</text>
  <text class="txt p" x="950" y="188">EPUB, DOCX, PDF</text>
  <rect class="public" x="920" y="260" width="310" height="130" rx="12"/>
  <text class="txt h" x="950" y="310">Public Repo</text>
  <text class="txt p" x="950" y="348">statische Website</text>
  <rect class="box" x="920" y="480" width="310" height="130" rx="12"/>
  <text class="txt h" x="950" y="530">Leserfeedback</text>
  <text class="txt p" x="950" y="568">Formular oder Issues</text>
  <path class="arrow" d="M380 215 H485"/>
  <path class="arrow" d="M810 190 H905"/>
  <path class="arrow" d="M810 240 C870 240 870 325 905 325"/>
  <path class="arrow" d="M1075 390 V465"/>
  <path class="arrow" d="M920 545 C660 665 330 610 230 305"/>
  <text class="txt s" x="70" y="690">Hinweis: GitHub Free kann Pages aus öffentlichen Repos bereitstellen. Das private Produktionsrepo bleibt intern; die Leseransicht wird gezielt veröffentlicht.</text>
</svg>
