<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720" role="img" aria-labelledby="title desc">
  <title id="title">Der Freitagsabschluss als wöchentlicher Zyklus</title>
  <desc id="desc">Sechs Schritte, die jede Woche wiederholt werden: Belege, Dateinamen, Rechnungen, Ausgaben, Aufgaben, Zusammenfassung.</desc>
  <rect width="1400" height="720" fill="#f7f7f3"/>
  <text x="80" y="80" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700" fill="#202124">Der Freitagsabschluss</text>
  <text x="80" y="122" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#4b5563">Sechs Schritte, jede Woche – damit kein Monatsrückstand entsteht.</text>

  <g font-family="Arial, Helvetica, sans-serif">
    <circle cx="700" cy="400" r="240" fill="none" stroke="#cbd5e1" stroke-width="3" stroke-dasharray="10 10"/>
    <circle cx="700" cy="400" r="120" fill="#eef2ff" stroke="#3730a3" stroke-width="3"/>
    <text x="700" y="386" text-anchor="middle" font-size="24" font-weight="700" fill="#312e81">Freitags</text>
    <text x="700" y="416" text-anchor="middle" font-size="19" fill="#3730a3">15–20 Minuten</text>
    <text x="700" y="442" text-anchor="middle" font-size="17" fill="#6b7280">Sie bestätigen</text>

    <g font-size="18" fill="#111827">
      <rect x="590" y="118" width="220" height="84" rx="14" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
      <text x="700" y="152" text-anchor="middle" font-weight="700">1 · Belege</text>
      <text x="700" y="180" text-anchor="middle" font-size="17">prüfen &amp; kategorisieren</text>

      <rect x="958" y="238" width="220" height="84" rx="14" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
      <text x="1068" y="272" text-anchor="middle" font-weight="700">2 · Dateinamen</text>
      <text x="1068" y="300" text-anchor="middle" font-size="17">vereinheitlichen</text>

      <rect x="958" y="478" width="220" height="84" rx="14" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
      <text x="1068" y="512" text-anchor="middle" font-weight="700">3 · Rechnungen</text>
      <text x="1068" y="540" text-anchor="middle" font-size="17">Status aktualisieren</text>

      <rect x="590" y="598" width="220" height="84" rx="14" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
      <text x="700" y="632" text-anchor="middle" font-weight="700">4 · Ausgaben</text>
      <text x="700" y="660" text-anchor="middle" font-size="17">eintragen</text>

      <rect x="222" y="478" width="220" height="84" rx="14" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
      <text x="332" y="512" text-anchor="middle" font-weight="700">5 · Aufgaben</text>
      <text x="332" y="540" text-anchor="middle" font-size="17">nächste Woche</text>

      <rect x="222" y="238" width="220" height="84" rx="14" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
      <text x="332" y="272" text-anchor="middle" font-weight="700">6 · Zusammenfassung</text>
      <text x="332" y="300" text-anchor="middle" font-size="17">der Woche</text>
    </g>
  </g>
</svg>
