<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">Die fünf Bausteine des persönlichen Agenten-Systems</title>
  <desc id="desc">Ein Stapel von unten nach oben: Kontext und Speicher als Fundament, darauf Rollen und Subagenten, Skills, Hooks und Berechtigungen, oben die Routinen.</desc>
  <rect width="1400" height="900" fill="#f7f7f3"/>
  <text x="80" y="86" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="700" fill="#202124">Die fünf Bausteine des Agenten-Systems</text>
  <text x="80" y="130" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#4b5563">Von unten nach oben aufgebaut: erst das Fundament, dann Schicht für Schicht ergänzen.</text>

  <g font-family="Arial, Helvetica, sans-serif">
    <!-- Routinen (oben) -->
    <rect x="120" y="190" width="1160" height="120" rx="16" fill="#fff7ed" stroke="#c2410c" stroke-width="3"/>
    <text x="160" y="240" font-size="30" font-weight="700" fill="#7c2d12">5 · Routinen</text>
    <text x="160" y="278" font-size="22" fill="#9a3412">Wiederkehrende Abläufe automatisch anstoßen: Morgenbriefing, Wochenrückschau, Freitagsabschluss.</text>

    <!-- Hooks & Berechtigungen -->
    <rect x="120" y="330" width="1160" height="120" rx="16" fill="#fef2f2" stroke="#b91c1c" stroke-width="3"/>
    <text x="160" y="380" font-size="30" font-weight="700" fill="#7f1d1d">4 · Hooks &amp; Berechtigungen</text>
    <text x="160" y="418" font-size="22" fill="#991b1b">Grenzen, die immer gelten: erlauben, verweigern oder zur Rückfrage eskalieren.</text>

    <!-- Skills -->
    <rect x="120" y="470" width="1160" height="120" rx="16" fill="#eff6ff" stroke="#1d4ed8" stroke-width="3"/>
    <text x="160" y="520" font-size="30" font-weight="700" fill="#1e3a8a">3 · Skills</text>
    <text x="160" y="558" font-size="22" fill="#1e40af">Wiederverwendbare Arbeitsmuster, die der Agent bei Bedarf abruft.</text>

    <!-- Rollen & Subagenten -->
    <rect x="120" y="610" width="1160" height="120" rx="16" fill="#ecfdf5" stroke="#047857" stroke-width="3"/>
    <text x="160" y="660" font-size="30" font-weight="700" fill="#064e3b">2 · Rollen &amp; Subagenten</text>
    <text x="160" y="698" font-size="22" fill="#065f46">Klare Zuständigkeiten mit eigenem Kontext, begrenzten Werkzeugen und passender Modellwahl.</text>

    <!-- Kontext & Speicher (Fundament) -->
    <rect x="120" y="750" width="1160" height="120" rx="16" fill="#eef2ff" stroke="#3730a3" stroke-width="4"/>
    <text x="160" y="800" font-size="30" font-weight="700" fill="#312e81">1 · Kontext &amp; Speicher (Fundament)</text>
    <text x="160" y="838" font-size="22" fill="#3730a3">CLAUDE.md und AGENTS.md, Auto-Memory und langlebiger Nutzerkontext.</text>

    <!-- Aufbaupfeil -->
    <path d="M70 850 L70 230" stroke="#6b7280" stroke-width="5" fill="none"/>
    <path d="M70 230 l-12 22 l24 0 z" fill="#6b7280"/>
    <text x="40" y="540" font-size="20" fill="#6b7280" transform="rotate(-90 40 540)">schrittweiser Aufbau</text>
  </g>
</svg>
