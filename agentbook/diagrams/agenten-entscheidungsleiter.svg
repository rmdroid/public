<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">Entscheidungsleiter für Agentenarbeit</title>
  <desc id="desc">Vier Stufen von einfachem Prompt über Workflow und Agent bis zum Multi-Agenten-System.</desc>
  <rect width="1400" height="820" fill="#f7f7f3"/>
  <text x="80" y="90" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="700" fill="#202124">Die Entscheidungsleiter</text>
  <text x="80" y="136" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#4b5563">Erst so einfach wie möglich starten. Mehr Autonomie nur, wenn die Aufgabe sie wirklich braucht.</text>

  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="90" y="580" width="290" height="150" rx="18" fill="#ffffff" stroke="#1f2937" stroke-width="3"/>
    <text x="125" y="632" font-size="30" font-weight="700" fill="#111827">Prompt</text>
    <text x="125" y="674" font-size="21" fill="#374151">Einmalige Textaufgabe</text>
    <text x="125" y="704" font-size="21" fill="#374151">klarer Kontext</text>

    <rect x="405" y="460" width="290" height="150" rx="18" fill="#ecfdf5" stroke="#047857" stroke-width="3"/>
    <text x="440" y="512" font-size="30" font-weight="700" fill="#064e3b">Workflow</text>
    <text x="440" y="554" font-size="21" fill="#065f46">Wiederkehrender Ablauf</text>
    <text x="440" y="584" font-size="21" fill="#065f46">klare Regeln</text>

    <rect x="720" y="340" width="290" height="150" rx="18" fill="#eff6ff" stroke="#1d4ed8" stroke-width="3"/>
    <text x="755" y="392" font-size="30" font-weight="700" fill="#1e3a8a">Agent</text>
    <text x="755" y="434" font-size="21" fill="#1e40af">Ziel statt Schrittfolge</text>
    <text x="755" y="464" font-size="21" fill="#1e40af">Werkzeuge + Prüfung</text>

    <rect x="1035" y="220" width="290" height="150" rx="18" fill="#fff7ed" stroke="#c2410c" stroke-width="3"/>
    <text x="1070" y="272" font-size="30" font-weight="700" fill="#7c2d12">Multi-Agenten</text>
    <text x="1070" y="314" font-size="21" fill="#9a3412">Mehrere Rollen</text>
    <text x="1070" y="344" font-size="21" fill="#9a3412">klare Übergaben</text>

    <path d="M380 610 L405 550" stroke="#6b7280" stroke-width="5" fill="none"/>
    <path d="M695 490 L720 430" stroke="#6b7280" stroke-width="5" fill="none"/>
    <path d="M1010 370 L1035 310" stroke="#6b7280" stroke-width="5" fill="none"/>

    <text x="102" y="205" font-size="23" font-weight="700" fill="#111827">Prüffrage vor dem nächsten Schritt:</text>
    <text x="102" y="245" font-size="22" fill="#374151">Braucht die Aufgabe wirklich mehr Autonomie, Zugriff oder Entscheidungsspielraum?</text>

    <rect x="90" y="300" width="585" height="86" rx="14" fill="#ffffff" stroke="#d1d5db"/>
    <text x="120" y="334" font-size="21" font-weight="700" fill="#111827">Niedriges Risiko</text>
    <text x="120" y="365" font-size="20" fill="#4b5563">Prompt oder Workflow, Ergebnis direkt prüfen.</text>

    <rect x="720" y="570" width="585" height="86" rx="14" fill="#ffffff" stroke="#d1d5db"/>
    <text x="750" y="604" font-size="21" font-weight="700" fill="#111827">Höheres Risiko</text>
    <text x="750" y="635" font-size="20" fill="#4b5563">Agent nur mit Ziel, Grenzen, Budget und Freigabe.</text>
  </g>
</svg>
